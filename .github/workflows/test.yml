name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg shellcheck
      - name: Record tool versions
        run: |
          python3 --version
          ffmpeg -version
      - name: Check launcher
        run: |
          bash -n startup_movie_delay_adder.sh
          shellcheck startup_movie_delay_adder.sh
      - name: Test paths, failure handling, and real audio/video
        run: python3 -m unittest discover -s tests -v
